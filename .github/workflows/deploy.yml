name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build site
        run: hugo --minify --gc

      # Renders public/ to Letter and A4 PDFs with the runner's Chrome.
      - name: Render PDFs
        run: npm run pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Deploy to Netlify
        run: npx --yes netlify-cli deploy --dir=public --prod --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
