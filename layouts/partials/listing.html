{{- /* A ruled listing of linked items. Context: dict "id" "list". */ -}}
<section class="listing" aria-labelledby="{{ .id }}-h">
  <h2 id="{{ .id }}-h" class="section-h">{{ i18n .id }}</h2>
  <table>
    <tbody>
      {{- range .list }}
      <tr>
        <th scope="row">{{ with .url }}<a href="{{ . }}" rel="noopener">{{ end }}{{ .title }}{{ with .url }}</a>{{ end }}</th>
        <td>{{ .tagline }}</td>
        <td class="listing-meta">{{ .meta }}</td>
      </tr>
      {{- end }}
    </tbody>
  </table>
</section>
